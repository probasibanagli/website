<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chennai MTC — Route Finder</title>
<style>
  :root{
    --navy:#12213A;
    --navy-deep:#0B1729;
    --amber:#F2A93B;
    --amber-dim:#8a6425;
    --cream:#F4EFE4;
    --line:#26375A;
    --green:#4FA37A;
    --muted:#8fa0bd;
    --card:#16264A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--navy-deep);
    color:var(--cream);
    font-family:'Segoe UI', Helvetica, Arial, sans-serif;
    min-height:100vh;
  }
  .topbar{
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    border-bottom:3px solid var(--amber);
    padding:22px 24px 18px;
  }
  .topbar-inner{max-width:880px;margin:0 auto;}
  .brand{
    display:flex; align-items:baseline; gap:10px;
  }
  .brand .badge{
    background:var(--amber); color:var(--navy-deep); font-weight:800;
    font-family:'Courier New', monospace; font-size:13px;
    padding:3px 8px; border-radius:4px; letter-spacing:0.5px;
  }
  .brand h1{
    font-size:22px; margin:0; font-weight:700; letter-spacing:0.2px;
  }
  .brand .sub{color:var(--muted); font-size:13px; margin-top:4px;}

  .wrap{max-width:880px; margin:0 auto; padding:24px;}

  .search-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    position:relative;
  }
  .field-row{
    display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;
  }
  .field{flex:1; min-width:200px; position:relative;}
  .field label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--muted); margin-bottom:6px;
  }
  .field input{
    width:100%; padding:11px 12px; border-radius:7px; border:1px solid var(--line);
    background:var(--navy-deep); color:var(--cream); font-size:15px; outline:none;
  }
  .field input:focus{border-color:var(--amber);}
  .swap-btn{
    background:var(--navy-deep); border:1px solid var(--line); color:var(--amber);
    width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:16px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .swap-btn:hover{border-color:var(--amber);}
  .go-btn{
    background:var(--amber); color:var(--navy-deep); border:none; font-weight:700;
    padding:11px 22px; border-radius:7px; cursor:pointer; font-size:15px; margin-top:14px;
  }
  .go-btn:hover{filter:brightness(1.08);}

  .suggest{
    position:absolute; top:100%; left:0; right:0; background:var(--navy);
    border:1px solid var(--line); border-radius:7px; margin-top:4px;
    max-height:220px; overflow-y:auto; z-index:10; display:none;
  }
  .suggest div{padding:9px 12px; cursor:pointer; font-size:14px; border-bottom:1px solid var(--line);}
  .suggest div:last-child{border-bottom:none;}
  .suggest div:hover{background:var(--line);}

  .results{margin-top:26px;}
  .results-heading{
    font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted);
    margin:0 0 12px 2px; display:flex; align-items:center; gap:8px;
  }
  .results-heading .count{color:var(--amber);}

  .route-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:12px;
  }
  .route-card.transfer{border-left:3px solid var(--amber-dim);}
  .route-card.direct{border-left:3px solid var(--green);}

  .route-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .bus-chip{
    background:var(--amber); color:var(--navy-deep); font-family:'Courier New', monospace;
    font-weight:800; font-size:14px; padding:4px 10px; border-radius:5px; letter-spacing:0.3px;
  }
  .bus-chip.alt{background:var(--green);}
  .arrow{color:var(--muted); font-size:13px;}
  .tag{
    font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted);
    border:1px solid var(--line); padding:2px 8px; border-radius:20px; margin-left:auto;
  }
  .tag.direct{color:var(--green); border-color:var(--green);}
  .tag.transfer{color:var(--amber); border-color:var(--amber-dim);}

  .route-endpoints{margin-top:10px; font-size:15px; font-weight:600;}
  .route-endpoints .via{color:var(--muted); font-weight:400; font-size:13px; margin:0 6px;}

  .route-detail{
    margin-top:10px; font-size:13px; color:var(--muted); line-height:1.5;
  }
  .transfer-point{
    color:var(--amber); font-weight:700;
  }

  .empty-state{
    text-align:center; padding:40px 20px; color:var(--muted); font-size:14px;
  }
  .empty-state .icon{font-size:32px; margin-bottom:10px;}

  footer{
    text-align:center; padding:30px 20px 50px; color:var(--muted); font-size:12px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="badge">MTC</span>
      <h1>Chennai Bus Route Finder</h1>
    </div>
    <div class="sub">Search direct buses or one-transfer journeys between any two stops</div>
  </div>
</div>

<div class="wrap">
  <div class="search-card">
    <div class="field-row">
      <div class="field">
        <label>From</label>
        <input type="text" id="fromInput" placeholder="e.g. Adyar" autocomplete="off">
        <div class="suggest" id="fromSuggest"></div>
      </div>
      <button class="swap-btn" id="swapBtn" title="Swap">⇄</button>
      <div class="field">
        <label>To</label>
        <input type="text" id="toInput" placeholder="e.g. Tambaram" autocomplete="off">
        <div class="suggest" id="toSuggest"></div>
      </div>
    </div>
    <button class="go-btn" id="searchBtn">Find Buses</button>
  </div>

  <div class="results" id="results"></div>
</div>

<footer>Data parsed from the official Chennai MTC bus routes list · Stop matching is approximate</footer>

<script>
// ---- Build lookup structures ----
const routes = MTC_DATA.map(r => {
  const stops = [r.Start];
  if (r.Route && r.Route.trim()) {
    r.Route.split(',').map(s => s.trim()).filter(Boolean).forEach(s => stops.push(s));
  }
  stops.push(r.Destination);
  return { ...r, stops };
});

const allStopNames = new Set();
routes.forEach(r => r.stops.forEach(s => allStopNames.add(s)));
const stopList = Array.from(allStopNames).sort();

function norm(s){ return s.toLowerCase().trim(); }

function matchesStop(routeStops, query){
  const q = norm(query);
  return routeStops.some(s => norm(s).includes(q));
}

function findStopIndex(routeStops, query){
  const q = norm(query);
  return routeStops.findIndex(s => norm(s).includes(q));
}

// ---- Autocomplete ----
function setupAutocomplete(inputId, suggestId){
  const input = document.getElementById(inputId);
  const suggest = document.getElementById(suggestId);
  input.addEventListener('input', () => {
    const q = norm(input.value);
    suggest.innerHTML = '';
    if (!q){ suggest.style.display = 'none'; return; }
    const matches = stopList.filter(s => norm(s).includes(q)).slice(0, 8);
    if (!matches.length){ suggest.style.display = 'none'; return; }
    matches.forEach(m => {
      const div = document.createElement('div');
      div.textContent = m;
      div.addEventListener('click', () => {
        input.value = m;
        suggest.style.display = 'none';
      });
      suggest.appendChild(div);
    });
    suggest.style.display = 'block';
  });
  document.addEventListener('click', (e) => {
    if (!suggest.contains(e.target) && e.target !== input) suggest.style.display = 'none';
  });
}
setupAutocomplete('fromInput', 'fromSuggest');
setupAutocomplete('toInput', 'toSuggest');

document.getElementById('swapBtn').addEventListener('click', () => {
  const f = document.getElementById('fromInput');
  const t = document.getElementById('toInput');
  const tmp = f.value; f.value = t.value; t.value = tmp;
});

// ---- Search logic ----
function search(){
  const from = document.getElementById('fromInput').value.trim();
  const to = document.getElementById('toInput').value.trim();
  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '';

  if (!from || !to){
    resultsEl.innerHTML = '<div class="empty-state"><div class="icon">🚌</div>Enter both a starting point and a destination to search.</div>';
    return;
  }

  // Direct matches: same bus route contains both stops, from-index before to-index
  const direct = [];
  routes.forEach(r => {
    const fi = findStopIndex(r.stops, from);
    const ti = findStopIndex(r.stops, to);
    if (fi !== -1 && ti !== -1 && fi < ti){
      direct.push({ bus: r, fi, ti });
    }
  });

  // One-transfer matches: bus A covers from -> X, bus B covers X -> to
  const transfers = [];
  if (direct.length < 8){
    const fromRoutes = routes.filter(r => findStopIndex(r.stops, from) !== -1);
    const toRoutes = routes.filter(r => findStopIndex(r.stops, to) !== -1);
    const seen = new Set();
    fromRoutes.forEach(rA => {
      const fi = findStopIndex(rA.stops, from);
      toRoutes.forEach(rB => {
        if (rA['Bus No'] === rB['Bus No'] && rA.Start === rB.Start) return;
        const tiB = findStopIndex(rB.stops, to);
        // find a common stop between rA (after 'from') and rB (before 'to')
        for (let a = fi + 1; a < rA.stops.length; a++){
          const stopA = norm(rA.stops[a]);
          for (let b = 0; b < tiB; b++){
            if (norm(rB.stops[b]) === stopA){
              const key = rA['Bus No']+'|'+rB['Bus No']+'|'+stopA;
              if (seen.has(key)) continue;
              seen.add(key);
              transfers.push({ busA: rA, busB: rB, transferStop: rA.stops[a], fi, a, b, tiB });
              break;
            }
          }
        }
      });
    });
  }
  transfers.sort((x,y) => (x.a - x.fi) - (y.a - y.fi));
  const limitedTransfers = transfers.slice(0, 6);

  if (!direct.length && !limitedTransfers.length){
    resultsEl.innerHTML = '<div class="empty-state"><div class="icon">🔍</div>No direct or one-transfer routes found between these stops in this dataset. Try a nearby landmark or double-check spelling.</div>';
    return;
  }

  if (direct.length){
    const h = document.createElement('div');
    h.className = 'results-heading';
    h.innerHTML = `Direct buses <span class="count">(${direct.length})</span>`;
    resultsEl.appendChild(h);
    direct.forEach(d => resultsEl.appendChild(renderDirectCard(d, from, to)));
  }

  if (limitedTransfers.length){
    const h = document.createElement('div');
    h.className = 'results-heading';
    h.innerHTML = `With one transfer <span class="count">(${limitedTransfers.length})</span>`;
    resultsEl.appendChild(h);
    limitedTransfers.forEach(t => resultsEl.appendChild(renderTransferCard(t, from, to)));
  }
}

function renderDirectCard(d, from, to){
  const card = document.createElement('div');
  card.className = 'route-card direct';
  card.innerHTML = `
    <div class="route-top">
      <span class="bus-chip">${d.bus['Bus No']}</span>
      <span class="arrow">${d.bus.Start} → ${d.bus.Destination}</span>
      <span class="tag direct">Direct</span>
    </div>
    <div class="route-endpoints">${escapeHtml(from)} <span class="via">board here</span> → ${escapeHtml(to)} <span class="via">alight here</span></div>
    <div class="route-detail">Full route: ${d.bus.stops.join(' → ')}</div>
  `;
  return card;
}

function renderTransferCard(t, from, to){
  const card = document.createElement('div');
  card.className = 'route-card transfer';
  card.innerHTML = `
    <div class="route-top">
      <span class="bus-chip">${t.busA['Bus No']}</span>
      <span class="arrow">then</span>
      <span class="bus-chip alt">${t.busB['Bus No']}</span>
      <span class="tag transfer">1 Transfer</span>
    </div>
    <div class="route-endpoints">${escapeHtml(from)} <span class="via">→ ${t.busA['Bus No']} →</span> <span class="transfer-point">${escapeHtml(t.transferStop)}</span> <span class="via">→ ${t.busB['Bus No']} →</span> ${escapeHtml(to)}</div>
    <div class="route-detail">
      Leg 1 (${t.busA['Bus No']}): ${t.busA.Start} → ${t.busA.Destination}<br>
      Leg 2 (${t.busB['Bus No']}): ${t.busB.Start} → ${t.busB.Destination}
    </div>
  `;
  return card;
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

document.getElementById('searchBtn').addEventListener('click', search);
document.getElementById('fromInput').addEventListener('keydown', e => { if(e.key==='Enter') search(); });
document.getElementById('toInput').addEventListener('keydown', e => { if(e.key==='Enter') search(); });

// initial empty state
document.getElementById('results').innerHTML = '<div class="empty-state"><div class="icon">🚌</div>Try searching, for example, <b>Adyar</b> to <b>Tambaram</b>.</div>';
</script>
